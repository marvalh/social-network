services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - db-data:/app/data
      - uploads:/app/uploads
      - private-uploads:/app/private_uploads

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
  private-uploads: